# Reverse proxy + cert renewal only. mate and the app run on the host under systemd.
# AIBLETON_ROOT defaults to /srv/aibleton; deploy.sh renders the nginx config and
# htpasswd into $AIBLETON_ROOT/proxy and certbot's state lives in $AIBLETON_ROOT/letsencrypt.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: aibleton-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${AIBLETON_ROOT:-/srv/aibleton}/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AIBLETON_ROOT:-/srv/aibleton}/proxy/htpasswd:/etc/nginx/htpasswd:ro
      - ${AIBLETON_ROOT:-/srv/aibleton}/letsencrypt:/etc/letsencrypt:ro
      - ${AIBLETON_ROOT:-/srv/aibleton}/certbot-www:/var/www/certbot:ro
    # Reload every 6h so a renewed cert is picked up without a deploy.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: aibleton-certbot
    restart: unless-stopped
    volumes:
      - ${AIBLETON_ROOT:-/srv/aibleton}/letsencrypt:/etc/letsencrypt
      - ${AIBLETON_ROOT:-/srv/aibleton}/certbot-www:/var/www/certbot
    # The initial cert is issued by deploy.sh --setup in standalone mode; this loop only renews.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
